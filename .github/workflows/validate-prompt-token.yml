name: Validate Prompt Bot Token

# ورک‌فلوی موقت: بررسی اتصال ربات پرامپت به تلگرام و ثبت نتیجه در data/tg-check.json
# (توکن هرگز چاپ یا ذخیره نمی‌شود)
on:
  push:
    paths:
      - '.github/workflows/validate-prompt-token.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check bot identity and write result
        env:
          PROMPT_BOT_TOKEN: ${{ secrets.PROMPT_BOT_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('prompt-bot/index.js', 'utf8');
            const m = src.match(/DEFAULT_PROMPT_TOKEN\s*=\s*'([^']+)'/);
            const token = process.env.PROMPT_BOT_TOKEN || (m ? m[1] : '');
            if (!token) { console.error('no token'); process.exit(1); }
            fetch('https://api.telegram.org/bot' + token + '/getMe')
              .then(r => r.json())
              .then(d => {
                const out = d.ok
                  ? { ok: true, id: d.result.id, username: d.result.username, name: d.result.first_name, canJoinGroups: d.result.can_join_groups, canReadAllGroupMessages: d.result.can_read_all_group_messages, checkedAt: new Date().toISOString() }
                  : { ok: false, error: d.description, checkedAt: new Date().toISOString() };
                fs.mkdirSync('data', { recursive: true });
                fs.writeFileSync('data/tg-check.json', JSON.stringify(out, null, 2));
                console.log(JSON.stringify(out));
                if (!d.ok) process.exit(1);
              })
              .catch(e => { console.error('fetch failed:', e.message); process.exit(1); });
          "

      - name: Launch bot 45s (live smoke)
        env:
          PROMPT_BOT_TOKEN: ${{ secrets.PROMPT_BOT_TOKEN }}
        run: |
          timeout 45 node -e "require('./prompt-bot/index.js'); setTimeout(() => process.exit(0), 40000);" 2>&1 | head -30 || true

      - name: Push result
        if: always()
        run: |
          git config user.name "prompt-bot-check"
          git config user.email "prompt-bot-check@users.noreply.github.com"
          git add -f data/tg-check.json || true
          git commit -m "bot check $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
